<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Dragalina 131 — Viewer 3D · V47 A1 FRAME</title>
  <style>
    :root {
      --bg: #1a1d22;
      --panel: #242830;
      --text: #e8eaed;
      --muted: #9aa3ad;
      --warn: #e8c547;
      --accent: #7eb6d9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
    aside { background: var(--panel); padding: 1rem 1.1rem; overflow: auto; border-right: 1px solid #3a4150; }
    h1 { font-size: 1.05rem; margin: 0 0 0.35rem; font-weight: 600; }
    .warn { background: #3a3418; color: var(--warn); padding: 0.65rem 0.75rem; border-radius: 6px; font-size: 0.82rem; line-height: 1.35; margin: 0.75rem 0; }
    .meta { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
    .meta strong { color: var(--text); font-weight: 560; }
    #c { width: 100%; height: 100%; display: block; }
    .tabs { display: flex; gap: 0.4rem; margin: 1rem 0 0.6rem; flex-wrap: wrap; }
    .tabs a { color: var(--accent); font-size: 0.8rem; text-decoration: none; border: 1px solid #3d4a5c; padding: 0.35rem 0.55rem; border-radius: 4px; }
    .tabs a:hover { background: #323846; }
    ul { padding-left: 1.1rem; font-size: 0.78rem; color: var(--muted); max-height: 40vh; overflow: auto; }
    code { font-size: 0.78rem; color: #c7d2fe; }
    .row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 0.6rem 0; }
    button {
      background: #323846; color: var(--text); border: 1px solid #4a5568;
      padding: 0.4rem 0.65rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
    }
    button.active { background: #3d5a80; border-color: var(--accent); }
    button:hover { background: #3a4250; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <aside>
      <h1 id="viewTitle">Dragalina 131 · Viewer</h1>
      <div class="warn" id="warning">Încărcare…</div>
      <div class="meta" id="meta"></div>
      <div class="row">
        <button type="button" id="btnClosed" class="active">Poartă închisă</button>
        <button type="button" id="btnOpen">Poartă deschisă</button>
      </div>
      <div class="row">
        <button type="button" id="btnBoth" class="active">P+E</button>
        <button type="button" id="btnParter">Doar parter</button>
        <button type="button" id="btnEtaj">Doar etaj</button>
        <button type="button" id="btnSubsol">Doar subsol</button>
        <button type="button" id="btnFence">Împrejmuire</button>
        <button type="button" id="btnCurte">Curte</button>
        <button type="button" id="btnStruct">1 · Structură</button>
        <button type="button" id="btnStructWalls">2 · + Pereți</button>
        <button type="button" id="btnCut">Secțiune interior</button>
      </div>
      <div class="tabs" id="tabsFrame">
        <a href="/viewer/?v=v47_a1_frame"><strong>3D FRAME</strong></a>
        <a href="../outputs/plans/36_v47_a1_frame_structure_overlay.svg" target="_blank">Overlay structură</a>
        <a href="../outputs/plans/37_v47_a1_frame_sections.svg" target="_blank">Secțiuni cadre</a>
        <a href="../outputs/reports/v47_a1_frame_structure.md" target="_blank">Raport structură</a>
        <a href="../outputs/plans/35_v47_a1_exterior_wall_section.svg" target="_blank">Perete A1 tencuială</a>
        <a href="../outputs/plans/35b_v47_a2_klinker_wall_section.svg" target="_blank">Perete A2 klinker</a>
        <a href="../outputs/reports/v47_useful_by_level.md" target="_blank">Util P/E</a>
        <a href="../outputs/reports/v47_pot_util_assemblies.md" target="_blank">POT + util</a>
        <a href="../decisions/assemblies_catalog_v01.md" target="_blank">Catalog straturi</a>
      </div>
      <p class="meta" style="margin-top:1rem">Orbit · zoom · pan dreapta</p>
      <p class="meta">Model unic: <code>V47 A1 FRAME</code> · regen <code>npm run volume:v47:studies</code></p>
      <ul id="meshes"></ul>
    </aside>
    <canvas id="c"></canvas>
  </div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x1a1d22);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(42, 2, 0.1, 200);
    camera.position.set(18, 14, 10);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(4, 2.5, -8);
    controls.enableDamping = true;
    controls.update();

    const hemi = new THREE.HemisphereLight(0xddeeff, 0x444433, 0.55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff2dd, 1.35);
    sun.position.set(12, 22, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 60;
    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.22));

    const grid = new THREE.GridHelper(40, 40, 0x3a4555, 0x2a313c);
    grid.position.y = -0.02;
    scene.add(grid);

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (canvas.width !== w || canvas.height !== h) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }

    function ring2d(poly) {
      const pts = poly.slice();
      if (pts.length > 1) {
        const a = pts[0], b = pts[pts.length - 1];
        if (Math.abs(a.x - b.x) < 1e-9 && Math.abs(a.y - b.y) < 1e-9) pts.pop();
      }
      return pts;
    }

    function makeExtrude(m) {
      const pts = ring2d(m.polygon);
      if (pts.length < 3) return new THREE.Group();
      const shape = new THREE.Shape();
      shape.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i].x, pts[i].y);
      shape.closePath();
      // Goluri (ex. curte engleză): winding opus față de conturul exterior
      for (const hole of m.holes || []) {
        const hp = ring2d(hole);
        if (hp.length < 3) continue;
        const path = new THREE.Path();
        path.moveTo(hp[0].x, hp[0].y);
        for (let i = 1; i < hp.length; i++) path.lineTo(hp[i].x, hp[i].y);
        path.closePath();
        shape.holes.push(path);
      }
      const depth = Math.max(0.01, m.z1_m - m.z0_m);
      const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
      const isMosaic = m.finish === "mozaic" || m.id?.includes("mozaic") || m.id?.includes("soclu");
      const mat = new THREE.MeshStandardMaterial({
        color: m.color,
        roughness: m.id?.startsWith("gol_") ? 0.15 : isMosaic ? 0.92 : 0.78,
        metalness: m.id?.startsWith("gol_") ? 0.05 : isMosaic ? 0 : 0.02,
        transparent: (m.opacity != null && m.opacity < 1) || !!m.id?.startsWith("gol_"),
        opacity: m.opacity ?? (m.id?.startsWith("gol_") ? 0.4 : 1),
        side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = m.z0_m;
      mesh.castShadow = !m.id?.startsWith("gol_") && !m.id?.startsWith("teren");
      mesh.receiveShadow = true;
      return mesh;
    }

    function makeRibbon(m) {
      const line = m.centerline;
      if (!line || line.length < 2) return new THREE.Group();
      const half = (m.width_m || 0.08) / 2;
      const left = [];
      const right = [];
      for (let i = 0; i < line.length; i++) {
        const a = line[Math.max(0, i - 1)];
        const b = line[i];
        const c = line[Math.min(line.length - 1, i + 1)];
        const dx = c.x - a.x;
        const dy = c.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        left.push({ x: b.x + nx * half, y: b.y + ny * half });
        right.push({ x: b.x - nx * half, y: b.y - ny * half });
      }
      return makeExtrude({ ...m, polygon: [...left, ...right.reverse()] });
    }

    /**
     * Triangles: vertices {x,y,z} sit — x est, y nord, z cotă.
     * Același cadru ca extrude: după Rx(-90°) pe Shape(x,y) → Three (x, z, -y).
     */
    function makeTriangles(m) {
      const verts = m.vertices || [];
      const faces = m.faces || [];
      if (verts.length < 3 || faces.length < 1) return new THREE.Group();
      const pos = new Float32Array(verts.length * 3);
      for (let i = 0; i < verts.length; i++) {
        const v = verts[i];
        pos[i * 3] = Number(v.x) || 0;
        pos[i * 3 + 1] = Number(v.z) || 0;
        pos[i * 3 + 2] = -(Number(v.y) || 0);
      }
      const idx = [];
      for (const f of faces) {
        if (!f || f.length < 3) continue;
        idx.push(f[0] | 0, f[1] | 0, f[2] | 0);
      }
      if (idx.length < 3) return new THREE.Group();
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setIndex(new THREE.BufferAttribute(new Uint32Array(idx), 1));
      geo.computeVertexNormals();
      geo.computeBoundingSphere();
      geo.computeBoundingBox();
      const mat = new THREE.MeshStandardMaterial({
        color: m.color || "#5c564e",
        roughness: m.roughness ?? 0.75,
        metalness: m.metalness ?? 0.05,
        transparent: m.opacity != null && m.opacity < 1,
        opacity: m.opacity ?? 1,
        side: THREE.DoubleSide,
        depthWrite: m.opacity == null || m.opacity >= 1,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.frustumCulled = true;
      // Muchii pe acoperiș — altfel panta e greu de citit pe schelet gri
      if ((m.id || "").startsWith("acoperis_")) {
        const edges = new THREE.EdgesGeometry(geo, 20);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color: 0xc4b49a, transparent: true, opacity: 0.85 })
        );
        line.raycast = () => {};
        mesh.add(line);
      }
      return mesh;
    }

    // /viewer fără slash → relative ./data cade pe /data (404); păstrează query
    if (/\/viewer$/i.test(location.pathname)) {
      location.replace(`/viewer/${location.search}${location.hash}`);
      throw new Error("redirect /viewer/");
    }
    // Model unic pe site: V47 A1 FRAME (cadre). V47 / A1 / V46 nu se mai încarcă.
    const volFile = "/viewer/data/volume_v47_a1_frame.json";
    const volRes = await fetch(`${volFile}?t=${Date.now()}`, { cache: "no-store" });
    if (!volRes.ok) {
      document.getElementById("warning").textContent = `Nu pot încărca ${volFile} (${volRes.status}).`;
      throw new Error(`volume fetch ${volRes.status}`);
    }
    const volume = await volRes.json();
    document.getElementById("viewTitle").textContent = "Dragalina 131 · V47 A1 FRAME (cadre)";
    document.getElementById("warning").textContent = volume.meta.warning || volume.meta.status;
    const env = volume.meta.envelope_m || {};
    const srcLabel = "V47 A1 FRAME · cadre BA · assemblies_v01 · neconstruibil";
    document.getElementById("meta").innerHTML = `
      <div><strong>Model:</strong> ${volume.meta.id}</div>
      <div><strong>Sursă:</strong> ${srcLabel}</div>
      <div><strong>Gabarit:</strong> ${(env.ew ?? 0).toFixed(2)} × ${(env.ns ?? 0).toFixed(2)} m = ${volume.building_summary.footprint_gross_m2} m²</div>
      <div><strong>Nivel:</strong> ${volume.meta.level_height_m} m · ${volume.building_summary.levels}</div>
      <div><strong>Pereți:</strong> ${volume.building_summary.walls}</div>
      <div><strong>Util audit:</strong> ${volume.building_summary.useful_audit_m2} m²</div>
    `;

    const gateClosed = [];
    const gateOpen = [];
    const parterObjs = [];
    const etajObjs = [];
    const subsolObjs = [];
    const alwaysObjs = [];
    const fenceObjs = [];
    const curteObjs = [];
    const structObjs = [];
    const umpluturaObjs = [];
    const list = document.getElementById("meshes");
    const root = new THREE.Group();
    scene.add(root);

    const H = volume.meta.level_height_m || 3.04;

    function isImprejmuireMesh(m) {
      const id = m.id || "";
      return (
        m.site_layer === "imprejmuire" ||
        id.startsWith("gard_") ||
        id.startsWith("limit_") ||
        id.startsWith("poarta_") ||
        id === "teren_cf" ||
        id.startsWith("amprenta_")
      );
    }
    function isCurteMesh(m) {
      const id = m.id || "";
      return (
        m.site_layer === "curte" ||
        id.startsWith("curte_") ||
        id.startsWith("alee_") ||
        id.startsWith("subsol_curte_engleza") ||
        id.startsWith("subsol_racord_") ||
        id === "subsol_palier_acces" ||
        id.startsWith("auto_") ||
        id === "teren_cf" ||
        id.startsWith("amprenta_") ||
        id.startsWith("gard_") ||
        id.startsWith("poarta_")
      );
    }
    /** View „1 · Structură” = DOAR schelet BA casă (stâlpi/grinzi/fg/placă/acoperiș BA).
     *  Fără: teren, amprentă, gard/porți, trepte, țiglă/PV, paleți finisaj. */
    function isStructuraMesh(m) {
      if (m.site_layer === "umplutura") return false;
      const id = m.id || "";
      // excluderi explicite (poluau view-ul)
      if (
        id === "teren_cf" ||
        id.startsWith("amprenta_") ||
        id.startsWith("fundatie_gard") ||
        id.startsWith("fundatie_poarta") ||
        id.startsWith("stalp_poarta_") ||
        id.startsWith("subsol_scara") ||
        id.startsWith("subsol_racord_") ||
        id.startsWith("subsol_palier") ||
        id.startsWith("subsol_pardoseala") ||
        id === "podest_se" ||
        id.startsWith("palier_superior") ||
        id.startsWith("treapta_") ||
        id.startsWith("acoperis_apa_") ||
        id.startsWith("acoperis_fronton_") ||
        id.startsWith("pv_") ||
        id.startsWith("gard_") ||
        id.startsWith("poarta_")
      ) {
        return false;
      }
      return (
        id.startsWith("stalp_continuu_") ||
        id.startsWith("subsol_pier_") ||
        id.startsWith("subsol_stalp_") ||
        id.startsWith("subsol_grinda_") ||
        id.startsWith("subsol_fg_") ||
        id.startsWith("subsol_put_beton") ||
        id.startsWith("subsol_fantana_beton") ||
        id === "subsol_grinda_y590_inverted" ||
        id === "subsol_intrados_placa" ||
        id.startsWith("parter_stalp_") ||
        id.startsWith("parter_grinda_") ||
        id.startsWith("parter_centura_") ||
        id.startsWith("etaj_stalp_") ||
        id.startsWith("etaj_grinda_") ||
        id.startsWith("etaj_centura_") ||
        id === "etaj_placa_structura" ||
        id.startsWith("structura_rampa") ||
        id.startsWith("structura_r2_") ||
        id.startsWith("structura_r180_") ||
        id.startsWith("acoperis_coama_") ||
        id.startsWith("acoperis_solbanc_") ||
        id.startsWith("acoperis_caprior_") ||
        id.startsWith("acoperis_structura_") ||
        (m.site_layer === "structura" &&
          (id.startsWith("stalp_") ||
            id.startsWith("subsol_grinda") ||
            id.startsWith("subsol_fg") ||
            id.startsWith("parter_centura") ||
            id.startsWith("etaj_centura") ||
            id.startsWith("acoperis_coama") ||
            id.startsWith("acoperis_caprior") ||
            id.startsWith("acoperis_solbanc") ||
            id.startsWith("acoperis_structura")))
      );
    }
    function isUmpluturaMesh(m) {
      return m.site_layer === "umplutura" || /subsol_zid_/.test(m.id || "");
    }
    /** pe fațadă EST/NORD împrejmuirea = zid casă — nu duplicăm gard în P+E */
    function isFacadeLimitOnly(m) {
      const id = m.id || "";
      return m.imprejmuire_only === true || id.startsWith("limit_");
    }
    /** zone dale/verde studiu — doar view Curte */
    function isCurteOnly(m) {
      return m.curte_only === true || (m.id || "").startsWith("curte_zona_");
    }

    for (const m of volume.meshes) {
      const li = document.createElement("li");
      li.textContent = m.label ? `${m.id}` : m.id;
      list.appendChild(li);

      let obj;
      if (m.type === "extrude") obj = makeExtrude(m);
      else if (m.type === "ribbon") obj = makeRibbon(m);
      else if (m.type === "triangles") obj = makeTriangles(m);
      else continue;

      obj.name = m.id;
      obj.userData.imprejmuire_only = isFacadeLimitOnly(m);
      obj.userData.curte_only = isCurteOnly(m);
      obj.userData.site_layer = m.site_layer || null;
      root.add(obj);

      if (m.state === "closed" || m.id === "poarta_inchisa") gateClosed.push(obj);
      if (m.state === "open" || m.id === "poarta_deschisa") gateOpen.push(obj);

      const zMid =
        m.type === "triangles" && m.vertices?.length
          ? m.vertices.reduce((s, v) => s + (v.z || 0), 0) / m.vertices.length
          : ((m.z0_m ?? 0) + (m.z1_m ?? 0)) / 2;
      const id = m.id || "";
      if (isImprejmuireMesh(m)) fenceObjs.push(obj);
      if (isCurteMesh(m)) curteObjs.push(obj);
      if (isStructuraMesh(m)) structObjs.push(obj);
      if (isUmpluturaMesh(m)) umpluturaObjs.push(obj);
      obj.userData.layer_structura = isStructuraMesh(m);
      obj.userData.layer_umplutura = isUmpluturaMesh(m);

      // limit_* / imprejmuire_only: NU în P+E (apar doar în view Împrejmuire)
      if (isFacadeLimitOnly(m)) {
        obj.visible = false;
        continue;
      }
      // zone dale/verde studiu: DOAR view Curte (nu sub sol în P+E)
      if (isCurteOnly(m)) {
        obj.visible = false;
        continue;
      }
      // parapet curte engleză: context sit
      if (id.startsWith("curte_engleza_")) {
        alwaysObjs.push(obj);
        continue;
      }
      if (id.startsWith("gard_")) {
        // gard real (vest/Closca/Dragalina S): context sit în always
        alwaysObjs.push(obj);
      } else if (id === "teren_cf" || id.startsWith("auto") || id.startsWith("poarta") || id.startsWith("amprenta_") || id.startsWith("alee_")) {
        alwaysObjs.push(obj);
      } else if (
        id.startsWith("stalp_continuu_") ||
        id.startsWith("etics_wrap_") ||
        id.startsWith("acoperis_structura_") ||
        id.startsWith("acoperis_caprior_") ||
        id.startsWith("acoperis_coama_") ||
        id.startsWith("acoperis_solbanc_")
      ) {
        // Stâlpi fundație→acoperiș + schelet acoperiș: vizibili pe S / P / E (nu doar pe zMid)
        subsolObjs.push(obj);
        parterObjs.push(obj);
        etajObjs.push(obj);
      } else if (
        id.startsWith("parter_centura_") ||
        id === "etaj_placa_structura"
      ) {
        // Planșeu P↔E = plafon parter / pardoseală etaj → vizibil și pe etaj
        parterObjs.push(obj);
        etajObjs.push(obj);
      } else if (id.startsWith("subsol_")) {
        subsolObjs.push(obj);
      } else if (zMid >= H - 0.05) etajObjs.push(obj);
      else parterObjs.push(obj);
    }

    function setGate(state) {
      for (const o of gateClosed) o.visible = state === "closed";
      for (const o of gateOpen) o.visible = state === "open";
      document.getElementById("btnClosed").classList.toggle("active", state === "closed");
      document.getElementById("btnOpen").classList.toggle("active", state === "open");
    }
    let cutaway = false;
    let levelMode = "both";

    function isRoofOrCeiling(n) {
      if (!n) return false;
      return (
        n.startsWith("acoperis") ||
        n.startsWith("pv_") ||
        n.includes("plafon") ||
        n.includes("copertina") ||
        n.includes("false_ceiling")
      );
    }

    function applyCutaway() {
      if (!cutaway) {
        document.getElementById("btnCut").classList.toggle("active", false);
        return;
      }
      root.traverse((o) => {
        if (!o.isMesh || !o.name) return;
        const n = o.name;
        // Ascunde acoperiș + fațade ca să vezi compartimentarea
        if (
          isRoofOrCeiling(n) ||
          n.includes("zid_nord") ||
          n.includes("zid_est_living") ||
          n.includes("zid_vest")
        ) {
          o.visible = false;
        }
      });
      document.getElementById("btnCut").classList.toggle("active", true);
    }

    function frameObjects(objs) {
      const box = new THREE.Box3();
      for (const o of objs) {
        if (o.visible) box.expandByObject(o);
      }
      if (box.isEmpty()) return;
      const c = box.getCenter(new THREE.Vector3());
      const s = box.getSize(new THREE.Vector3());
      const r = Math.max(s.x, s.y, s.z) * 0.9;
      controls.target.set(c.x, c.y, c.z);
      camera.position.set(c.x + r * 0.45, c.y + r * 0.85, c.z + r * 0.55);
      controls.update();
    }

    function clearLevelButtons() {
      for (const id of [
        "btnBoth",
        "btnParter",
        "btnEtaj",
        "btnSubsol",
        "btnFence",
        "btnCurte",
        "btnStruct",
        "btnStructWalls",
      ]) {
        document.getElementById(id)?.classList.toggle("active", false);
      }
    }

    function setLevel(mode) {
      levelMode = mode;
      if (mode === "imprejmuire" || mode === "curte" || mode === "structura" || mode === "structura_pereti") {
        root.traverse((o) => {
          if (!o.isMesh) return;
          o.visible = false;
        });
        let layer = [];
        if (mode === "imprejmuire") {
          layer = fenceObjs;
          for (const o of layer) o.visible = true;
        } else if (mode === "curte") {
          layer = curteObjs;
          for (const o of layer) o.visible = true;
          for (const o of fenceObjs) {
            if ((o.name || "").startsWith("limit_")) o.visible = false;
            else if ((o.name || "").startsWith("gard_") || (o.name || "").startsWith("poarta_")) o.visible = true;
          }
          for (const o of subsolObjs) {
            const n = o.name || "";
            if (
              n.startsWith("subsol_scara") ||
              n === "subsol_palier_jos" ||
              n === "subsol_palier_acces" ||
              n.startsWith("subsol_pardoseala") ||
              n.startsWith("subsol_zid_") ||
              n === "subsol_prag_usa_hol" ||
              n === "subsol_usa_camere"
            ) {
              o.visible = true;
            }
          }
        } else if (mode === "structura") {
          // 1 · doar schelet beton legat — fără învelitoare/PV ca să se vadă coama+căpriorii
          layer = structObjs;
          for (const o of structObjs) {
            const n = o.name || "";
            if (
              n.startsWith("acoperis_apa_") ||
              n.startsWith("acoperis_fronton_") ||
              n.startsWith("pv_")
            ) {
              o.visible = false;
            } else {
              o.visible = true;
            }
          }
        } else if (mode === "structura_pereti") {
          // 2 · structură + umplutură sono / pereți (tot fără învelitoare — vezi schelet acoperiș)
          layer = [...structObjs, ...umpluturaObjs];
          for (const o of structObjs) {
            const n = o.name || "";
            o.visible = !(
              n.startsWith("acoperis_apa_") ||
              n.startsWith("acoperis_fronton_") ||
              n.startsWith("pv_")
            );
          }
          for (const o of umpluturaObjs) o.visible = true;
        }
        for (const o of gateClosed) o.visible = document.getElementById("btnClosed").classList.contains("active");
        for (const o of gateOpen) o.visible = document.getElementById("btnOpen").classList.contains("active");
        clearLevelButtons();
        document.getElementById("btnFence")?.classList.toggle("active", mode === "imprejmuire");
        document.getElementById("btnCurte")?.classList.toggle("active", mode === "curte");
        document.getElementById("btnStruct")?.classList.toggle("active", mode === "structura");
        document.getElementById("btnStructWalls")?.classList.toggle("active", mode === "structura_pereti");
        if (cutaway) applyCutaway();
        frameObjects(layer);
        return;
      }
      for (const o of alwaysObjs) o.visible = true;
      for (const o of parterObjs) {
        o.visible = mode === "both" || mode === "parter";
      }
      for (const o of etajObjs) {
        o.visible = mode === "both" || mode === "etaj";
      }
      for (const o of subsolObjs) {
        // both: show L-1; parter/etaj: hide; subsol: only these
        o.visible = mode === "both" || mode === "subsol";
      }
      // niciodată pe fațadă EST/NORD ca „gard”; zone studiu curte doar în view Curte
      root.traverse((o) => {
        if (!o.isMesh) return;
        if (o.userData?.imprejmuire_only) o.visible = false;
        if (o.userData?.curte_only) o.visible = false;
      });
      if (mode === "etaj" || mode === "parter") {
        root.traverse((o) => {
          if (!o.isMesh) return;
          const n = o.name || "";
          if (n.startsWith("subsol_")) o.visible = false;
          // Pe parter: fără acoperiș (vezi placa). Pe etaj: schelet acoperiș DA, învelitoare/PV opțional ascunse ca să vezi coama.
          if (mode === "parter" && isRoofOrCeiling(n)) o.visible = false;
          if (mode === "etaj") {
            if (n.startsWith("acoperis_apa_") || n.startsWith("acoperis_fronton_") || n.startsWith("pv_")) {
              o.visible = false;
            }
            // umplutură: lasă semi-transparent deja; stâlpi continui rămân
          }
        });
      }
      if (mode === "subsol") {
        for (const o of parterObjs) o.visible = false;
        for (const o of etajObjs) o.visible = false;
        for (const o of subsolObjs) o.visible = true;
        // fără teren/amprentă peste plan — altfel camerele dispar sub capac verde
        for (const o of alwaysObjs) {
          const n = o.name || "";
          o.visible = !(n === "teren_cf" || n.startsWith("amprenta_") || n.startsWith("alee_"));
        }
        root.traverse((o) => {
          if (!o.isMesh) return;
          if (o.userData?.imprejmuire_only) o.visible = false;
          const n = o.name || "";
          if (n === "subsol_intrados_placa") o.visible = false;
          if (n === "teren_cf" || n.startsWith("amprenta_")) o.visible = false;
          // trepte + ziduri fântână (site_layer curte) rămân vizibile în Doar subsol
          if (n.startsWith("subsol_racord_") || n.startsWith("subsol_curte_engleza") || n.startsWith("curte_engleza_")) {
            o.visible = true;
          }
        });
      }
      clearLevelButtons();
      document.getElementById("btnBoth").classList.toggle("active", mode === "both");
      document.getElementById("btnParter").classList.toggle("active", mode === "parter");
      document.getElementById("btnEtaj").classList.toggle("active", mode === "etaj");
      document.getElementById("btnSubsol").classList.toggle("active", mode === "subsol");
      if (cutaway) applyCutaway();

      if (mode === "etaj") frameObjects(etajObjs);
      if (mode === "subsol") frameObjects(subsolObjs);
    }
    setGate(volume.meta.gate_default_state || "closed");
    setLevel("structura");
    {
      const tip = document.createElement("p");
      tip.className = "meta";
      tip.style.color = "#e8a87c";
      tip.innerHTML =
        "<strong>FRAME:</strong> <em>1 · Structură</em> = doar cadru BA (stâlpi/grinzi/fg/placă/coamă) — fără gard, trepte, țiglă. · Planuri P/E = sursă de adevăr. · Audit proiectare: <code>v47_a1_frame_structure_design_audit_v03.md</code>.";
      document.getElementById("meta")?.after(tip);
    }
    document.getElementById("btnClosed").onclick = () => setGate("closed");
    document.getElementById("btnOpen").onclick = () => setGate("open");
    document.getElementById("btnBoth").onclick = () => setLevel("both");
    document.getElementById("btnParter").onclick = () => setLevel("parter");
    document.getElementById("btnEtaj").onclick = () => setLevel("etaj");
    document.getElementById("btnSubsol").onclick = () => setLevel("subsol");
    document.getElementById("btnFence").onclick = () => setLevel("imprejmuire");
    document.getElementById("btnCurte").onclick = () => setLevel("curte");
    document.getElementById("btnStruct").onclick = () => setLevel("structura");
    document.getElementById("btnStructWalls").onclick = () => setLevel("structura_pereti");
    document.getElementById("btnCut").onclick = () => {
      cutaway = !cutaway;
      setLevel(levelMode);
    };

    {
      const box = new THREE.Box3().setFromObject(root);
      if (!box.isEmpty()) {
        const c = box.getCenter(new THREE.Vector3());
        const s = box.getSize(new THREE.Vector3());
        const r = Math.max(s.x, s.y, s.z) * 0.85;
        controls.target.copy(c);
        camera.position.set(c.x + r * 1.15, c.y + r * 0.75, c.z + r * 1.05);
        controls.update();
      }
    }

    function frame() {
      resize();
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>

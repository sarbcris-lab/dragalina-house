<text x="196.20000000000002" y="329.9" font-size="8" fill="#2d5a27">grindă întoarsă −30…−5 (studiu)</text>
<text x="40" y="290" font-size="9" fill="#444">Clear acces: fără grindă sub −30 pe clar. Încadrare în sandwich −30…+32 = calcul (nerezolvat).</text>
<text x="520" y="50" font-size="11">B — cote planșeu etaj (absolut cm)</text>
<text x="520" y="70" font-size="10" font-family="IBM Plex Sans,Segoe UI,sans-serif">FF etaj: <tspan font-weight="600">336 cm</tspan></text>
<text x="520" y="88" font-size="10" font-family="IBM Plex Sans,Segoe UI,sans-serif">față sup. placă (FF−12): <tspan font-weight="600">324 cm</tspan></text>
<text x="520" y="106" font-size="10" font-family="IBM Plex Sans,Segoe UI,sans-serif">intrados placă (15 ip.): <tspan font-weight="600">309 cm</tspan></text>
<text x="520" y="124" font-size="10" font-family="IBM Plex Sans,Segoe UI,sans-serif">intrados grindă (35 ip.): <tspan font-weight="600">289 cm</tspan></text>
<text x="520" y="142" font-size="10" font-family="IBM Plex Sans,Segoe UI,sans-serif">FF parter: <tspan font-weight="600">48 cm</tspan></text>
<text x="520" y="160" font-size="10" font-family="IBM Plex Sans,Segoe UI,sans-serif">clear P sub grindă: <tspan font-weight="600">241 cm</tspan></text>
<text x="520" y="188" font-size="9" fill="#444" width="400">Nu suprapune placa structurală cu pachetul de pardoseală 12 cm.</text>
<text x="40" y="340" font-size="11">C — rampe: plăci continue (reazeme = calcul)</text>
<text x="40" y="360" font-size="9" fill="#444">Model: placă înclinată AABB pe amprenta rampelor 1/2 + scară beci; podest SE ca reazem intermediar. Clear acces beci de recalculat după reazeme reale.</text>
